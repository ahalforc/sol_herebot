services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${SOL_HEREBOT_DISCORD_TOKEN:?export SOL_HEREBOT_DISCORD_TOKEN in your shell, then rerun docker compose}
      DISCORD_CLIENT_ID: ${SOL_HEREBOT_DISCORD_CLIENT_ID:?export SOL_HEREBOT_DISCORD_CLIENT_ID in your shell, then rerun docker compose}
